<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sheep Jam Pro</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0b132b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 600px;
            background: linear-gradient(135deg, #1c2541, #0b132b);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border: 4px solid #3a506b;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(11, 19, 43, 0.95);
            border-radius: 20px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #6fffe9;
            text-shadow: 0 0 10px rgba(111,255,233,0.5);
            text-align: center;
        }
        p {
            color: #b5e2fa;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
            font-size: 16px;
        }
        .btn {
            background: #5bc0be;
            color: #0b132b;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(91,192,190,0.4);
            transition: transform 0.2s, background 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
            background: #438a88;
        }
        #header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #6fffe9;
        }
        #grid {
            position: relative;
            width: 300px;
            height: 400px;
            background: #1c2541;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #5bc0be;
        }
        .sheep {
            position: absolute;
            width: 58px;
            height: 58px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            z-index: 2;
        }
        .sheep:active {
            transform: scale(0.9);
        }
        .exit-zone {
            position: absolute;
            background: rgba(91, 192, 190, 0.3);
            border: 2px dashed #5bc0be;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 1;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Стартовое меню -->
        <div id="menu-screen" class="screen">
            <h1>Sheep Jam Pro</h1>
            <p>Помогите овечкам выбраться с парковки, избегая столкновений!</p>
            <button class="btn" onclick="startGame()">ИГРАТЬ</button>
        </div>

        <!-- Экран победы -->
        <div id="win-screen" class="screen hidden">
            <h1>Уровень пройден! 🎉</h1>
            <p>Отличная работа, все овечки на свободе!</p>
            <button class="btn" onclick="nextLevel()">ДАЛЕЕ</button>
        </div>

        <!-- Игровой интерфейс -->
        <div id="header">
            <span id="level-indicator">Уровень: 1</span>
            <span id="score-indicator">Очки: 0</span>
        </div>

        <div id="grid"></div>

        <div style="font-size: 13px; color: #5bc0be; text-align: center;">
            Нажмите на овечку, чтобы отправить её к выходу
        </div>
    </div>

    <script>
        const GRID_COLS = 5;
        const GRID_ROWS = 6;
        const CELL_SIZE = 60; // 300 / 5

        let currentLevel = 1;
        let score = 0;
        let sheepList = [];
        let isAnimating = false;

        const colors = ['#ff5964', '#35a7ff', '#fdca40', '#9bf6ff'];

        function startGame() {
            document.getElementById('menu-screen').classList.add('hidden');
            initLevel();
        }

        function nextLevel() {
            currentLevel++;
            document.getElementById('win-screen').classList.add('hidden');
            initLevel();
        }

        function initLevel() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            sheepList = [];
            isAnimating = false;

            document.getElementById('level-indicator').innerText = `Уровень: ${currentLevel}`;

            // Создаем зоны выхода по краям
            const exits = [
                {x: 2, y: -1, dir: 'up'},
                {x: 2, y: GRID_ROWS, dir: 'down'}
            ];

            exits.forEach(e => {
                const div = document.createElement('div');
                div.className = 'exit-zone';
                div.style.left = (e.x * CELL_SIZE) + 'px';
                div.style.top = (e.y < 0 ? 0 : (GRID_ROWS - 1) * CELL_SIZE) + 'px';
                div.style.width = CELL_SIZE + 'px';
                div.style.height = '10px';
                div.innerHTML = '🚪';
                grid.appendChild(div);
            });

            // Генерация овечек без тупиков (упрощенная гарантированная расстановка)
            let count = Math.min(3 + currentLevel, 12);
            let positions = [];

            for (let i = 0; i < count; i++) {
                let rx, ry;
                let attempts = 0;
                do {
                    rx = Math.floor(Math.random() * GRID_COLS);
                    ry = Math.floor(Math.random() * (GRID_ROWS - 2)) + 1;
                    attempts++;
                } while (positions.some(p => p.x === rx && p.y === ry) && attempts < 50);

                if (attempts < 50) {
                    positions.push({x: rx, y: ry});
                    let sheep = {
                        id: i,
                        x: rx,
                        y: ry,
                        targetY: ry < GRID_ROWS / 2 ? -1 : GRID_ROWS, // Выход вверх или вниз
                        emoji: ['🐑', '🐏', '🐐', ' lamb '][i % 4],
                        color: colors[i % colors.length]
                    };
                    sheepList.push(sheep);
                    renderSheepElement(sheep);
                }
            }
        }

        function renderSheepElement(sheep) {
            const grid = document.getElementById('grid');
            const el = document.createElement('div');
            el.className = 'sheep';
            el.id = `sheep-${sheep.id}`;
            el.style.width = (CELL_SIZE - 4) + 'px';
            el.style.height = (CELL_SIZE - 4) + 'px';
            el.style.backgroundColor = sheep.color;
            el.style.left = (sheep.x * CELL_SIZE + 2) + 'px';
            el.style.top = (sheep.y * CELL_SIZE + 2) + 'px';
            el.innerText = '🐑';
            
            el.onclick = () => tryMoveSheep(sheep);
            grid.appendChild(el);
        }

        function tryMoveSheep(sheep) {
            if (isAnimating) return;

            // Проверяем, есть ли преграды на пути овечки к ее выходу по вертикали
            let pathClear = true;
            let step = sheep.targetY < sheep.y ? -1 : 1;
            
            let checkY = sheep.y + step;
            while (checkY !== sheep.targetY + step && checkY >= -1 && checkY <= GRID_ROWS) {
                // Проверяем, занята ли клетка другой овечкой
                if (sheepList.some(s => s.id !== sheep.id && s.x === sheep.x && s.y === checkY)) {
                    pathClear = false;
                    break;
                }
                checkY += step;
            }

            if (!pathClear) {
                // Анимация «стука» о преграду (не может пройти)
                const el = document.getElementById(`sheep-${sheep.id}`);
                el.style.transform = `scale(1.15)`;
                setTimeout(() => el.style.transform = 'scale(1)', 200);
                return;
            }

            // Успешный выход овечки с плавной анимацией
            isAnimating = true;
            sheep.y = sheep.targetY;
            const el = document.getElementById(`sheep-${sheep.id}`);
            el.style.transition = 'top 0.4s ease-in-out, opacity 0.4s ease-in-out';
            el.style.top = (sheep.y * CELL_SIZE + 2) + 'px';
            el.style.opacity = '0';

            setTimeout(() => {
                el.remove();
                sheepList = sheepList.filter(s => s.id !== sheep.id);
                score += 10;
                document.getElementById('score-indicator').innerText = `Очки: ${score}`;
                isAnimating = false;

                // Проверка на победу
                if (sheepList.length === 0) {
                    document.getElementById('win-screen').classList.remove('hidden');
                }
            }, 400);
        }
    </script>
</body>
</html>
