<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sheep Jam 3D Isometric</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0b132b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 380px;
            height: 640px;
            background: linear-gradient(135deg, #1c2541, #0b132b);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border: 4px solid #3a506b;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(11, 19, 43, 0.96);
            border-radius: 20px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 30px;
            margin-bottom: 10px;
            color: #6fffe9;
            text-shadow: 0 0 10px rgba(111,255,233,0.5);
            text-align: center;
        }
        p {
            color: #b5e2fa;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
            font-size: 15px;
        }
        .btn {
            background: #5bc0be;
            color: #0b132b;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(91,192,190,0.4);
            transition: transform 0.2s, background 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
            background: #438a88;
        }
        #header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #6fffe9;
        }
        #isometric-board {
            position: relative;
            width: 330px;
            height: 380px;
            perspective: 800px;
            margin-top: 20px;
        }
        /* Изометрическая сцена */
        .isometric-plane {
            position: absolute;
            width: 260px;
            height: 260px;
            left: 35px;
            top: 50px;
            transform: rotateX(55deg) rotateZ(-45deg);
            transform-style: preserve-style;
            background: rgba(28, 37, 65, 0.8);
            border: 3px solid #5bc0be;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        /* Элементы в изометрии */
        .iso-tile {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 1px dashed rgba(91, 192, 190, 0.2);
        }
        .iso-sheep {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 22px;
            box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
            transform: rotateZ(45deg) rotateX(-55deg); /* Компенсация поворота плоскости для лица игроку */
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            border: 2px solid rgba(255,255,255,0.4);
        }
        .iso-sheep:active {
            transform: rotateZ(45deg) rotateX(-55deg) scale(0.85);
        }
        .dir-arrow {
            font-size: 10px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 1px 4px;
            border-radius: 4px;
            margin-top: -4px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Стартовое меню -->
        <div id="menu-screen" class="screen">
            <h1>Sheep Jam 3D</h1>
            <p>Изометрическая головоломка! Выводите овечек в 4 направлениях.</p>
            <button class="btn" onclick="startGame()">ИГРАТЬ</button>
        </div>

        <!-- Экран победы -->
        <div id="win-screen" class="screen hidden">
            <h1>Уровень пройден! 🎉</h1>
            <p>Превосходно! Пробка полностью разобрана.</p>
            <button class="btn" onclick="nextLevel()">ДАЛЕЕ</button>
        </div>

        <!-- Шапка -->
        <div id="header">
            <span id="level-indicator">Уровень: 1</span>
            <span id="score-indicator">Очки: 0</span>
        </div>

        <!-- Игровая изометрическая зона -->
        <div id="isometric-board">
            <div class="isometric-plane" id="plane"></div>
        </div>

        <div style="font-size: 12px; color: #5bc0be; text-align: center;">
            Кликайте на овечек, чтобы запустить их по стрелке
        </div>
    </div>

    <script>
        const GRID_SIZE = 4; // 4x4 сетка
        const STEP_PX = 65;  // Шаг в пикселях для изометрии

        let currentLevel = 1;
        let score = 0;
        let sheepList = [];
        let isAnimating = false;

        // 4 направления движения
        const directions = [
            { dx: 0, dy: -1, symbol: '⬆️', name: 'up' },
            { dx: 0, dy: 1,  symbol: '⬇️', name: 'down' },
            { dx: -1, dy: 0, symbol: '⬅️', name: 'left' },
            { dx: 1, dy: 0,  symbol: '➡️', name: 'right' }
        ];

        const sheepColors = ['#ff5964', '#35a7ff', '#fdca40', '#70c1b3', '#b5179e'];

        function startGame() {
            document.getElementById('menu-screen').classList.add('hidden');
            initLevel();
        }

        function nextLevel() {
            currentLevel++;
            document.getElementById('win-screen').classList.add('hidden');
            initLevel();
        }

        function initLevel() {
            const plane = document.getElementById('plane');
            plane.innerHTML = '';
            sheepList = [];
            isAnimating = false;

            document.getElementById('level-indicator').innerText = `Уровень: ${currentLevel}`;

            // Генерация сетки подложки
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    const tile = document.createElement('div');
                    tile.className = 'iso-tile';
                    tile.style.left = (x * STEP_PX + 5) + 'px';
                    tile.style.top = (y * STEP_PX + 5) + 'px';
                    plane.appendChild(tile);
                }
            }

            // Создаем овечек (от 4 до 8 штук в зависимости от уровня)
            let count = Math.min(3 + currentLevel, 12);
            let positions = [];

            for (let i = 0; i < count; i++) {
                let rx, ry;
                let attempts = 0;
                do {
                    rx = Math.floor(Math.random() * GRID_SIZE);
                    ry = Math.floor(Math.random() * GRID_SIZE);
                    attempts++;
                } while (positions.some(p => p.x === rx && p.y === ry) && attempts < 50);

                if (attempts < 50) {
                    positions.push({x: rx, y: ry});
                    
                    // Выбираем случайное направление для овечки
                    let dir = directions[Math.floor(Math.random() * directions.length)];

                    let sheep = {
                        id: i,
                        x: rx,
                        y: ry,
                        dir: dir,
                        color: sheepColors[i % sheepColors.length]
                    };
                    sheepList.push(sheep);
                    renderSheep(sheep);
                }
            }
        }

        function renderSheep(sheep) {
            const plane = document.getElementById('plane');
            const el = document.createElement('div');
            el.className = 'iso-sheep';
            el.id = `sheep-${sheep.id}`;
            el.style.backgroundColor = sheep.color;
            el.style.left = (sheep.x * STEP_PX + 8) + 'px';
            el.style.top = (sheep.y * STEP_PX + 8) + 'px';
            el.innerHTML = `<span>🐑</span><div class="dir-arrow">${sheep.dir.symbol}</div>`;

            el.onclick = () => tryMove(sheep);
            plane.appendChild(el);
        }

        function tryMove(sheep) {
            if (isAnimating) return;

            // Проверяем свободность пути в выбранном направлении до границ поля (-1 или GRID_SIZE)
            let pathClear = true;
            let cx = sheep.x + sheep.dir.dx;
            let cy = sheep.y + sheep.dir.dy;

            while (cx >= 0 && cx < GRID_SIZE && cy >= 0 && cy < GRID_SIZE) {
                if (sheepList.some(s => s.id !== sheep.id && s.x === cx && s.y === cy)) {
                    pathClear = false;
                    break;
                }
                cx += sheep.dir.dx;
                cy += sheep.dir.dy;
            }

            const el = document.getElementById(`sheep-${sheep.id}`);

            if (!pathClear) {
                // Анимация толчка (не может пройти)
                el.style.transform = `rotateZ(45deg) rotateX(-55deg) scale(1.15)`;
                setTimeout(() => {
                    el.style.transform = `rotateZ(45deg) rotateX(-55deg) scale(1)`;
                }, 200);
                return;
            }

            // Успешный выход за границы сетки
            isAnimating = true;
            
            // Вычисляем точку вылета за пределы плоскости
            sheep.x += sheep.dir.dx * (GRID_SIZE + 1);
            sheep.y += sheep.dir.dy * (GRID_SIZE + 1);

            el.style.transition = 'left 0.35s ease-in, top 0.35s ease-in, opacity 0.35s ease-in';
            el.style.left = (sheep.x * STEP_PX + 8) + 'px';
            el.style.top = (sheep.y * STEP_PX + 8) + 'px';
            el.style.opacity = '0';

            setTimeout(() => {
                el.remove();
                sheepList = sheepList.filter(s => s.id !== sheep.id);
                score += 20;
                document.getElementById('score-indicator').innerText = `Очки: ${score}`;
                isAnimating = false;

                if (sheepList.length === 0) {
                    document.getElementById('win-screen').classList.remove('hidden');
                }
            }, 350);
        }
    </script>
</body>
</html>
