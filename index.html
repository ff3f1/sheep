<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sheep Jam Pro</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0b132b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 620px;
            background: linear-gradient(135deg, #1c2541, #0b132b);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border: 4px solid #3a506b;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(11, 19, 43, 0.96);
            border-radius: 20px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #6fffe9;
            text-shadow: 0 0 10px rgba(111,255,233,0.5);
            text-align: center;
        }
        p {
            color: #b5e2fa;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
            font-size: 16px;
        }
        .btn {
            background: #5bc0be;
            color: #0b132b;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(91,192,190,0.4);
            transition: transform 0.2s, background 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
            background: #438a88;
        }
        #header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #6fffe9;
        }
        #grid {
            position: relative;
            width: 300px;
            height: 420px;
            background: #1c2541;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #5bc0be;
        }
        .sheep {
            position: absolute;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            z-index: 2;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .sheep span {
            font-size: 22px;
            line-height: 1;
        }
        .arrow {
            font-size: 12px;
            font-weight: bold;
            margin-top: -2px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .exit-zone {
            position: absolute;
            width: 60px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            z-index: 1;
            border-radius: 6px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Стартовое меню -->
        <div id="menu-screen" class="screen">
            <h1>Sheep Jam Pro</h1>
            <p>Направляйте овечек к выходам стрелочками нужного цвета!</p>
            <button class="btn" onclick="startGame()">ИГРАТЬ</button>
        </div>

        <!-- Экран победы -->
        <div id="win-screen" class="screen hidden">
            <h1>Уровень пройден! 🎉</h1>
            <p>Великолепно! Все овечки спасены.</p>
            <button class="btn" onclick="nextLevel()">ДАЛЕЕ</button>
        </div>

        <!-- Шапка игры -->
        <div id="header">
            <span id="level-indicator">Уровень: 1</span>
            <span id="score-indicator">Очки: 0</span>
        </div>

        <!-- Игровое поле -->
        <div id="grid"></div>

        <div style="font-size: 12px; color: #5bc0be; text-align: center;">
            Кликайте по овечке, чтобы запустить её в сторону стрелки
        </div>
    </div>

    <script>
        const GRID_COLS = 5;
        const GRID_ROWS = 7;
        const CELL_SIZE = 60; // 300 / 5

        let currentLevel = 1;
        let score = 0;
        let sheepList = [];
        let isAnimating = false;

        const themeColors = [
            { bg: '#ff5964', arrow: '⬆️', targetY: -1, label: 'Вверх' },
            { bg: '#35a7ff', arrow: '⬇️', targetY: GRID_ROWS, label: 'Вниз' }
        ];

        function startGame() {
            document.getElementById('menu-screen').classList.add('hidden');
            initLevel();
        }

        function nextLevel() {
            currentLevel++;
            document.getElementById('win-screen').classList.add('hidden');
            initLevel();
        }

        function initLevel() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            sheepList = [];
            isAnimating = false;

            document.getElementById('level-indicator').innerText = `Уровень: ${currentLevel}`;

            // Создаем визуальные ворота (выходы) сверху и снизу
            for (let c = 0; c < GRID_COLS; c += 2) {
                createExit(c, 0, '⬆️', '#ff5964');
                createExit(c, GRID_ROWS - 1, '⬇️', '#35a7ff');
            }

            // Генерируем овечек
            let count = Math.min(4 + Math.floor(currentLevel / 2), 10);
            let positions = [];

            for (let i = 0; i < count; i++) {
                let rx, ry;
                let attempts = 0;
                do {
                    rx = Math.floor(Math.random() * GRID_COLS);
                    ry = Math.floor(Math.random() * (GRID_ROWS - 4)) + 2;
                    attempts++;
                } while (positions.some(p => p.x === rx && p.y === ry) && attempts < 50);

                if (attempts < 50) {
                    positions.push({x: rx, y: ry});
                    // Определяем направление на основе вертикали (верхняя половина поля бежит вверх, нижняя — вниз)
                    let directionType = ry < GRID_ROWS / 2 ? 0 : 1;
                    let config = themeColors[directionType];

                    let sheep = {
                        id: i,
                        x: rx,
                        y: ry,
                        targetY: config.targetY,
                        color: config.bg,
                        arrow: config.arrow
                    };
                    sheepList.push(sheep);
                    renderSheepElement(sheep);
                }
            }
        }

        function createExit(x, y, arrowSymbol, color) {
            const grid = document.getElementById('grid');
            const div = document.createElement('div');
            div.className = 'exit-zone';
            div.style.left = (x * CELL_SIZE + 2) + 'px';
            div.style.top = (y === 0 ? 0 : (GRID_ROWS - 1) * CELL_SIZE + 16) + 'px';
            div.style.backgroundColor = color;
            div.innerHTML = `<span style="font-size:12px;">🚪 ${arrowSymbol}</span>`;
            grid.appendChild(div);
        }

        function renderSheepElement(sheep) {
            const grid = document.getElementById('grid');
            const el = document.createElement('div');
            el.className = 'sheep';
            el.id = `sheep-${sheep.id}`;
            el.style.backgroundColor = sheep.color;
            el.style.left = (sheep.x * CELL_SIZE + 2) + 'px';
            el.style.top = (sheep.y * CELL_SIZE + 2) + 'px';
            el.style.width = (CELL_SIZE - 4) + 'px';
            el.style.height = (CELL_SIZE - 4) + 'px';
            el.innerHTML = `<span>🐑</span><div class="arrow">${sheep.arrow}</div>`;
            
            el.onclick = () => tryMoveSheep(sheep);
            grid.appendChild(el);
        }

        function tryMoveSheep(sheep) {
            if (isAnimating) return;

            // Проверяем преграды на пути к выходу
            let pathClear = true;
            let step = sheep.targetY < sheep.y ? -1 : 1;
            let checkY = sheep.y + step;

            while (checkY !== sheep.targetY + step && checkY >= -1 && checkY <= GRID_ROWS) {
                if (sheepList.some(s => s.id !== sheep.id && s.x === sheep.x && s.y === checkY)) {
                    pathClear = false;
                    break;
                }
                checkY += step;
            }

            const el = document.getElementById(`sheep-${sheep.id}`);

            if (!pathClear) {
                // Анимация удара в барьер / другую овцу
                el.classList.add('shake');
                setTimeout(() => el.classList.remove('shake'), 300);
                return;
            }

            // Успешный побег
            isAnimating = true;
            sheep.y = sheep.targetY;
            el.style.transition = 'top 0.35s ease-in-out, opacity 0.35s ease-in-out';
            el.style.top = (sheep.y * CELL_SIZE + 2) + 'px';
            el.style.opacity = '0';

            setTimeout(() => {
                el.remove();
                sheepList = sheepList.filter(s => s.id !== sheep.id);
                score += 15;
                document.getElementById('score-indicator').innerText = `Очки: ${score}`;
                isAnimating = false;

                if (sheepList.length === 0) {
                    document.getElementById('win-screen').classList.remove('hidden');
                }
            }, 350);
        }
    </script>
</body>
</html>
