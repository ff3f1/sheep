<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sheep Jam Pro</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0b132b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 640px;
            background: linear-gradient(135deg, #1c2541, #0b132b);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border: 4px solid #3a506b;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(11, 19, 43, 0.96);
            border-radius: 20px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #6fffe9;
            text-shadow: 0 0 10px rgba(111,255,233,0.5);
            text-align: center;
        }
        p {
            color: #b5e2fa;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
            font-size: 16px;
        }
        .btn {
            background: #5bc0be;
            color: #0b132b;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(91,192,190,0.4);
            transition: transform 0.2s, background 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
            background: #438a88;
        }
        #header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #6fffe9;
        }
        #grid {
            position: relative;
            width: 300px;
            height: 420px;
            background: #141c2e;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #5bc0be;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .sheep {
            position: absolute;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            z-index: 5;
            border: 2px solid rgba(255,255,255,0.6);
        }
        .sheep span {
            font-size: 22px;
            line-height: 1;
        }
        .arrow {
            font-size: 11px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 1px 5px;
            border-radius: 6px;
            margin-top: 1px;
        }
        .exit-gate {
            position: absolute;
            background: #3a506b;
            border: 2px dashed #6fffe9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 2;
            border-radius: 6px;
        }
        @keyframes bounce-shake {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12) rotate(3deg); }
        }
        .shake {
            animation: bounce-shake 0.3s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Стартовое меню -->
        <div id="menu-screen" class="screen">
            <h1>Sheep Jam</h1>
            <p>Увлекательная головоломка с овечками! Выводите их в свободные ворота.</p>
            <button class="btn" onclick="startGame()">ИГРАТЬ</button>
        </div>

        <!-- Экран победы -->
        <div id="win-screen" class="screen hidden">
            <h1>Уровень пройден! 🎉</h1>
            <p>Великолепно! Все овечки на свободе.</p>
            <button class="btn" onclick="nextLevel()">ДАЛЕЕ</button>
        </div>

        <!-- Шапка -->
        <div id="header">
            <span id="level-indicator">Уровень: 1</span>
            <span id="score-indicator">Очки: 0</span>
        </div>

        <!-- Игровое поле -->
        <div id="grid"></div>

        <div style="font-size: 12px; color: #5bc0be; text-align: center;">
            Кликайте на овечку, чтобы она побежала к воротам
        </div>
    </div>

    <script>
        const COLS = 5;
        const ROWS = 7;
        const CELL = 60; // 300 / 5

        let currentLevel = 1;
        let score = 0;
        let sheepList = [];
        let isAnimating = false;

        // 4 направления выходов по периметру
        const directions = [
            { dx: 0, dy: -1, symbol: '⬆️', targetY: -1, gateX: 2, gateY: 0, w: 60, h: 8 }, // Верх
            { dx: 0, dy: 1,  symbol: '⬇️', targetY: ROWS, gateX: 2, gateY: ROWS - 1, w: 60, h: 8 }, // Низ
            { dx: -1, dy: 0, symbol: '⬅️', targetX: -1, gateX: 0, gateY: 3, w: 8, h: 60 }, // Лево
            { dx: 1, dy: 0,  symbol: '➡️', targetX: COLS, gateX: COLS - 1, gateY: 3, w: 8, h: 60 }  // Право
        ];

        const colors = ['#ff5964', '#35a7ff', '#fdca40', '#70c1b3', '#b5179e'];

        function startGame() {
            document.getElementById('menu-screen').classList.add('hidden');
            initLevel();
        }

        function nextLevel() {
            currentLevel++;
            document.getElementById('win-screen').classList.add('hidden');
            initLevel();
        }

        function initLevel() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            sheepList = [];
            isAnimating = false;

            document.getElementById('level-indicator').innerText = `Уровень: ${currentLevel}`;

            // Рисуем ворота выхода
            directions.forEach(d => {
                const gate = document.createElement('div');
                gate.className = 'exit-gate';
                gate.style.width = d.w + 'px';
                gate.style.height = d.h + 'px';
                gate.style.left = (d.gateX * CELL + (d.w === 8 ? (d.dx > 0 ? CELL - 8 : 0) : 0)) + 'px';
                gate.style.top = (d.gateY * CELL + (d.h === 8 ? (d.dy > 0 ? CELL - 8 : 0) : 0)) + 'px';
                gate.innerHTML = `<span style="font-size:9px;">${d.symbol}</span>`;
                grid.appendChild(gate);
            });

            // Генерация овечек (от 4 до 9 штук)
            let count = Math.min(3 + currentLevel, 10);
            let positions = [];

            for (let i = 0; i < count; i++) {
                let rx, ry;
                let attempts = 0;
                do {
                    rx = Math.floor(Math.random() * COLS);
                    ry = Math.floor(Math.random() * (ROWS - 2)) + 1;
                    attempts++;
                } while (positions.some(p => p.x === rx && p.y === ry) && attempts < 50);

                if (attempts < 50) {
                    positions.push({x: rx, y: ry});
                    let dir = directions[Math.floor(Math.random() * directions.length)];

                    let sheep = {
                        id: i,
                        x: rx,
                        y: ry,
                        dir: dir,
                        color: colors[i % colors.length]
                    };
                    sheepList.push(sheep);
                    renderSheep(sheep);
                }
            }
        }

        function renderSheep(sheep) {
            const grid = document.getElementById('grid');
            const el = document.createElement('div');
            el.className = 'sheep';
            el.id = `sheep-${sheep.id}`;
            el.style.backgroundColor = sheep.color;
            el.style.left = (sheep.x * CELL + 3) + 'px';
            el.style.top = (sheep.y * CELL + 3) + 'px';
            el.innerHTML = `<span>🐑</span><div class="arrow">${sheep.dir.symbol}</div>`;

            el.onclick = () => tryMove(sheep);
            grid.appendChild(el);
        }

        function tryMove(sheep) {
            if (isAnimating) return;

            // Проверяем путь в выбранном направлении до упора
            let pathClear = true;
            let cx = sheep.x + sheep.dir.dx;
            let cy = sheep.y + sheep.dir.dy;

            while (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) {
                if (sheepList.some(s => s.id !== sheep.id && s.x === cx && s.y === cy)) {
                    pathClear = false;
                    break;
                }
                cx += sheep.dir.dx;
                cy += sheep.dir.dy;
            }

            const el = document.getElementById(`sheep-${sheep.id}`);

            if (!pathClear) {
                el.classList.add('shake');
                setTimeout(() => el.classList.remove('shake'), 300);
                return;
            }

            // Успешный побег за границы
            isAnimating = true;
            sheep.x += sheep.dir.dx * (COLS + 1);
            sheep.y += sheep.dir.dy * (ROWS + 1);

            el.style.transition = 'left 0.3s ease-in, top 0.3s ease-in, opacity 0.3s ease-in';
            el.style.left = (sheep.x * CELL + 3) + 'px';
            el.style.top = (sheep.y * CELL + 3) + 'px';
            el.style.opacity = '0';

            setTimeout(() => {
                el.remove();
                sheepList = sheepList.filter(s => s.id !== sheep.id);
                score += 15;
                document.getElementById('score-indicator').innerText = `Очки: ${score}`;
                isAnimating = false;

                if (sheepList.length === 0) {
                    document.getElementById('win-screen').classList.remove('hidden');
                }
            }, 300);
        }
    </script>
</body>
</html>
