name: Blackwell CPU voice smoke test
on:
  push:
    branches: [blackwell-voice-test]
    paths: ['.github/workflows/blackwell-voice-test.yml']
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy soundfile omegaconf
      - name: Synthesize and validate
        run: |
          mkdir -p output
          curl --fail --location --retry 2 --max-time 180 https://models.silero.ai/models/tts/ru/v5_cis_base.pt -o model.pt
          python - <<'PY'
          import torch, numpy as np, soundfile as sf, json
          from pathlib import Path
          torch.set_num_threads(2)
          model = torch.package.PackageImporter("model.pt").load_pickle("tts_models", "model")
          model.to(torch.device("cpu"))
          text = "Это проверка русской озвучки. Голос создаётся на облачном процессоре, без домашнего компьютера."
          with torch.inference_mode():
              wav = model.apply_tts(text=text, speaker="ru_roman", sample_rate=48000)
          audio = wav.detach().cpu().numpy().reshape(-1)
          assert np.isfinite(audio).all()
          assert 2 < len(audio)/48000 < 30
          assert np.sqrt(np.mean(audio**2)) > 0.005
          sf.write("output/voice.wav", audio, 48000, subtype="PCM_16")
          info = {"model":"v5_cis_base","speaker":"ru_roman","duration":len(audio)/48000,"sample_rate":48000,"peak":float(np.abs(audio).max()),"rms":float(np.sqrt(np.mean(audio**2))),"bytes":Path("output/voice.wav").stat().st_size}
          Path("output/result.json").write_text(json.dumps(info,indent=2))
          print(json.dumps(info))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blackwell-voice-smoke-test
          path: output/
          retention-days: 1
          if-no-files-found: error
