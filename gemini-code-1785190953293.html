<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sheep Jam Pro 🐑</title>
    <style>
        :root {
            --bg: #0b132b;
            --panel: #1c2541;
            --accent: #6fffe9;
            --primary: #5bc0be;
            --danger: #ff0055;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
            padding: 10px;
        }

        .game-card {
            background: var(--panel);
            border-radius: 24px; padding: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; align-items: center;
            max-width: 420px; width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; margin-bottom: 12px;
        }

        h1 { font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 6px; }

        .btn {
            background: var(--primary); color: #0b132b;
            border: none; padding: 8px 14px; border-radius: 12px;
            font-weight: bold; cursor: pointer; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        canvas {
            width: 100%; height: 360px;
            border-radius: 16px;
            background: #111d42;
            cursor: pointer;
        }

        .dock-container {
            margin-top: 12px; width: 100%;
            background: rgba(11, 19, 43, 0.8);
            border: 2px dashed #3a506b;
            border-radius: 16px; padding: 8px;
            display: flex; justify-content: center; gap: 6px;
            min-height: 58px;
        }

        .dock-slot {
            width: 44px; height: 44px; border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; transition: all 0.2s;
        }
        .dock-slot.filled { transform: scale(1.05); }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 43, 0.95); border-radius: 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); z-index: 10; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .overlay h2 { font-size: 28px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="game-card">
    <div class="header">
        <h1>🐑 Sheep Jam Pro</h1>
        <button class="btn" onclick="initGame()">Перезапуск</button>
    </div>

    <canvas id="gameCanvas" width="360" height="360"></canvas>

    <div class="dock-container" id="dock">
        <div class="dock-slot"></div><div class="dock-slot"></div>
        <div class="dock-slot"></div><div class="dock-slot"></div>
        <div class="dock-slot"></div><div class="dock-slot"></div>
        <div class="dock-slot"></div>
    </div>

    <div class="overlay" id="overlay">
        <h2 id="overlayTitle">ПОБЕДА! 🎉</h2>
        <button class="btn" style="padding: 12px 24px; font-size: 16px;" onclick="initGame()">СЛЕДУЮЩИЙ УРОВЕНЬ</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 6;
    const CELL_SIZE = 60;
    const MAX_DOCK = 7;

    const SHEEP_TYPES = {
        white:  { emoji: '🐑', color: '#ffffff' },
        pink:   { emoji: '🦩', color: '#ff758f' },
        blue:   { emoji: '💎', color: '#38bdf8' },
        yellow: { emoji: '🌟', color: '#fbbf24' }
    };

    const DIRS = {
        UP:    { x: 0,  y: -1, angle: -Math.PI/2 },
        DOWN:  { x: 0,  y: 1,  angle: Math.PI/2 },
        LEFT:  { x: -1, y: 0,  angle: Math.PI },
        RIGHT: { x: 1,  y: 0,  angle: 0 }
    };

    let sheepList = [];
    let dockSlots = [];

    class Sheep {
        constructor(id, x, y, typeKey, dirKey) {
            this.id = id; this.x = x; this.y = y;
            this.px = x * CELL_SIZE + 30;
            this.py = y * CELL_SIZE + 30;
            this.typeKey = typeKey;
            this.type = SHEEP_TYPES[typeKey];
            this.dirKey = dirKey;
            this.dir = DIRS[dirKey];
            this.isBlocked = false;
        }

        draw() {
            ctx.save();
            ctx.translate(this.px, this.py);

            // Тень
            ctx.beginPath();
            ctx.ellipse(0, 12, 16, 5, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();

            // Тело
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fillStyle = this.isBlocked ? '#64748b' : this.type.color;
            ctx.fill();

            // Мордочка / направление
            ctx.rotate(this.dir.angle);
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(10, 0, 4, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }
    }

    // Проверка пути до ворот
    function checkBlocked(sheep) {
        let cx = sheep.x + sheep.dir.x;
        let cy = sheep.y + sheep.dir.y;

        while (cx >= 0 && cx < GRID_SIZE && cy >= 0 && cy < GRID_SIZE) {
            if (sheepList.some(s => s.x === cx && s.y === cy)) {
                return true; // На пути стоит другая овца
            }
            cx += sheep.dir.x; cy += sheep.dir.y;
        }
        return false; // Путь свободен
    }

    function updateBlockedState() {
        sheepList.forEach(s => s.isBlocked = checkBlocked(s));
    }

    // Генератор решаемого поля
    function initGame() {
        document.getElementById('overlay').classList.remove('active');
        dockSlots = []; updateDockUI();
        sheepList = [];

        const types = ['white', 'pink', 'blue', 'yellow'];
        const dirKeys = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
        let id = 0;

        // Создаем наборы по 3 одинаковые овечки
        for(let i=0; i<3; i++) {
            types.forEach(t => {
                let x, y, dirKey;
                let attempts = 0;
                do {
                    x = Math.floor(Math.random() * 4) + 1;
                    y = Math.floor(Math.random() * 4) + 1;
                    dirKey = dirKeys[Math.floor(Math.random() * 4)];
                    attempts++;
                } while(sheepList.some(s => s.x === x && s.y === y) && attempts < 100);

                sheepList.push(new Sheep(id++, x, y, t, dirKey));
            });
        }
        updateBlockedState();
    }

    function updateDockUI() {
        const slots = document.querySelectorAll('.dock-slot');
        slots.forEach((slot, i) => {
            if (i < dockSlots.length) {
                slot.innerText = SHEEP_TYPES[dockSlots[i]].emoji;
                slot.classList.add('filled');
            } else {
                slot.innerText = '';
                slot.classList.remove('filled');
            }
        });

        checkMatch3();
    }

    function checkMatch3() {
        const counts = {};
        dockSlots.forEach(t => counts[t] = (counts[t] || 0) + 1);

        for (let t in counts) {
            if (counts[t] >= 3) {
                let count = 0;
                dockSlots = dockSlots.filter(item => {
                    if (item === t && count < 3) { count++; return false; }
                    return true;
                });
                setTimeout(updateDockUI, 150);
                return;
            }
        }

        if (dockSlots.length >= MAX_DOCK) showEnd(false);
        else if (sheepList.length === 0 && dockSlots.length === 0) showEnd(true);
    }

    function showEnd(win) {
        const overlay = document.getElementById('overlay');
        document.getElementById('overlayTitle').innerText = win ? 'ПОБЕДА! 🎉' : 'ТУПИК! 💥';
        overlay.classList.add('active');
    }

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;

        for (let i = 0; i < sheepList.length; i++) {
            let s = sheepList[i];
            let dist = Math.hypot(s.px - cx, s.py - cy);

            if (dist <= 22) {
                if (!checkBlocked(s)) {
                    dockSlots.push(s.typeKey);
                    sheepList.splice(i, 1);
                    updateBlockedState();
                    updateDockUI();
                }
                break;
            }
        }
    });

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Отрисовка ворот/выходов
        ctx.strokeStyle = '#3a506b'; ctx.lineWidth = 6;
        ctx.strokeRect(10, 10, 340, 340);
        ctx.clearRect(150, 6, 60, 10);  // Верх
        ctx.clearRect(150, 344, 60, 10); // Низ
        ctx.clearRect(6, 150, 10, 60);  // Лево
        ctx.clearRect(344, 150, 10, 60); // Право

        sheepList.forEach(s => s.draw());
        requestAnimationFrame(render);
    }

    initGame();
    render();
</script>
</body>
</html>
